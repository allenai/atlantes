name: Build, lint, and test ais

on:
  push:
    branches:
      - "main"
    paths:
      - "ais/**"
      - ".github/workflows/build_lint_test_ais.yaml"
  pull_request:
    branches:
      - "main"
    paths:
      - "ais/**"
      - ".github/workflows/build_lint_test_ais.yaml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SERVICE_NAME: "eai"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linting:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-ais-${{ matrix.python-version }}-${{ hashFiles('ais/.pre-commit-config.yaml') }}

      - name: Linting
        run: |
          pip install pre-commit interrogate
          pre-commit run --all-files -c ais/.pre-commit-config.yaml

  tests:
    runs-on: GPU-Enabled-Runner
    env:
      COMPOSE_FILE: docker-compose.yml

    steps:
      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Checkout LFS objects for test cases
        run: git lfs checkout

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate into gcp
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: ${{secrets.GOOGLE_CREDENTIALS }}

      - name: Build docker images
        run: |
          COMPOSE_DOCKER_CLI_BUILD=1 DOCKER_BUILDKIT=1 docker compose -f ais/docker-compose.yml build
      - name: Run unit and integration tests
        run: |
          docker compose -f ais/docker-compose.yml run \
            -e TEST_PROJECTS_FOLDER_PREFIX=${{ secrets.TEST_PROJECTS_FOLDER_PREFIX }} \
            test_activity pytest -n auto \
            --ignore=tests/test_main_activity.py \
            --ignore=tests/test_main_entity.py \
            --ignore=tests/integration/inference/atlas_entity/ \
            --ignore=tests/integration/inference/atlas_activity/ \
            -vv
      - name: Run Pipeline tests
        run: |
          docker compose -f ais/docker-compose.yml run \
            -e TEST_PROJECTS_FOLDER_PREFIX=${{ secrets.TEST_PROJECTS_FOLDER_PREFIX }} \
            test_entity pytest tests/integration/inference/atlas_entity/ \
            --ignore=tests/integration/inference/atlas_entity/grpc_serve/test_serve_grpc.py \
            -vv
          docker compose -f ais/docker-compose.yml run \
            -e TEST_PROJECTS_FOLDER_PREFIX=${{ secrets.TEST_PROJECTS_FOLDER_PREFIX }} \
            test_activity pytest tests/integration/inference/atlas_activity/ \
            --ignore=tests/integration/inference/atlas_activity/grpc_serve/test_serve_grpc.py \
            -vv
      - name: Run service tests
        run: |
          COMPOSE_DOCKER_CLI_BUILD=1 DOCKER_BUILDKIT=1 docker compose -f ais/docker-compose.yml up -d --wait || {
            echo "🚨 Containers failed to start! Printing logs..."
            docker ps -a
            docker compose -f ais/docker-compose.yml logs
            exit 1
          }
          sleep 20
          docker compose -f ais/docker-compose.yml exec -T \
            -e TEST_PROJECTS_FOLDER_PREFIX=${{ secrets.TEST_PROJECTS_FOLDER_PREFIX }} \
            test_activity pytest tests/test_main_activity.py -vv
          docker compose -f ais/docker-compose.yml exec -T \
            -e TEST_PROJECTS_FOLDER_PREFIX=${{ secrets.TEST_PROJECTS_FOLDER_PREFIX }} \
            test_entity pytest tests/test_main_entity.py -vv
          docker compose -f ais/docker-compose.yml exec -T \
            -e TEST_PROJECTS_FOLDER_PREFIX=${{ secrets.TEST_PROJECTS_FOLDER_PREFIX }} \
            test_entity_postprocessor_grpc pytest tests/integration/inference/atlas_entity/grpc_serve/test_serve_grpc.py -vv
          docker compose -f ais/docker-compose.yml exec -T \
            -e TEST_PROJECTS_FOLDER_PREFIX=${{ secrets.TEST_PROJECTS_FOLDER_PREFIX }} \
            test_activity_postprocessor_grpc pytest tests/integration/inference/atlas_activity/grpc_serve/test_serve_grpc.py -vv

  build-and-push-image:
    runs-on: ubuntu-latest-m
    permissions:
      contents: read
      packages: write
    outputs:
      ghcr_docker_image: ${{ steps.image-names.outputs.ghcr_image_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Get short SHA
        run: echo "GIT_COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV


      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v7
        with:
          context: ais/
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT_HASH=${{ env.GIT_COMMIT_HASH }}

      - name: Store Image Names
        # We need the docker image name downstream in test & deploy. This saves the full docker image names to outputs
        id: image-names
        run: |-
          GHCR_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}"
          GHCR_IMAGE=`echo ${GHCR_IMAGE} | tr '[:upper:]' '[:lower:]'` # docker requires that all image names be lowercase
          echo "ghcr.io Docker image name is ${GHCR_IMAGE}"
          echo "ghcr_image_name=\"${IMAGE}\"" >> $GITHUB_OUTPUT
