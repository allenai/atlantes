name: CPD

on:
  push:
    branches:
      - "main"
    paths:
      - "cpd/**"
      - ".github/workflows/cpd.yml"
  pull_request:
    branches:
      - "main"
    paths:
      - "cpd/**"
      - ".github/workflows/cpd.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-cpd

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cpd
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cpd/pyproject.toml

      - name: Install
        run: pip install -e '.[dev]'

      - name: Unit and integration tests
        run: pytest tests --ignore=tests/integration/serve -vv

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Get short SHA
        run: echo "GIT_COMMIT_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build image
        run: docker build --build-arg GIT_COMMIT_HASH="$GIT_COMMIT_HASH" -t atlantes-cpd cpd

      - name: Start service and wait for it to be healthy
        run: |
          docker run -d --name cpd -p 5206:5206 atlantes-cpd
          for _ in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' cpd)
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "Service did not become healthy"
          docker logs cpd
          exit 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: gRPC service test
        working-directory: cpd
        run: |
          pip install -e '.[dev]'
          CPD_ADDRESS=127.0.0.1 pytest tests/integration/serve -vv

      - name: Log in to the Container registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=sha,format=short
            type=raw,value=latest

      - name: Push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: cpd
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT_HASH=${{ env.GIT_COMMIT_HASH }}
