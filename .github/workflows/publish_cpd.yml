name: Publish atlantes-cpd

# Publish by creating a GitHub release whose tag is `v<version>`, where
# <version> matches the repo-wide VERSION file. A release covers the whole repo;
# atlantes-cpd is one of its artifacts.
on:
  release:
    types:
      - released

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-dist:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2

      - name: Validate that the release tag matches the VERSION file
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION=$(tr -d '[:space:]' < VERSION)
          if [ "$RELEASE_VERSION" != "$FILE_VERSION" ]; then
            echo "Release version ($RELEASE_VERSION) does not match the VERSION file ($FILE_VERSION)"
            exit 1
          fi
          echo "Version validation passed: $RELEASE_VERSION"

      - name: Build sdist and wheel
        working-directory: cpd
        run: uv build

      - name: Check the distributions
        working-directory: cpd
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: cpd/dist/

  pypi-publish:
    needs: build-dist
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
