[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "atlantes-cpd"
dynamic = ["version"]
description = "Online changepoint detection for AIS tracks, served over gRPC"
authors = [{name = "Skylight Team", email = "skylight@skylight.global"}]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "grpcio>1.65.1,<2",
    "grpcio-health-checking>=1,<2",
    "numpy>=1.26,<3",
    "protobuf>=4.25,<5",
    "scipy>=1.12,<2",
]

[project.urls]
Homepage = "https://github.com/allenai/atlantes"
Repository = "https://github.com/allenai/atlantes"

[project.optional-dependencies]
validate = [
    "click>=8.1,<9",
    "matplotlib>=3.8,<4",
    "pandas>=2.2,<3",
]
dev = [
    "atlantes-cpd[validate]",
    "pytest>7,<9",
    "pytest-xdist",
]

[project.scripts]
atlantes-cpd-serve = "atlantes_cpd.serve.serve_grpc:serve"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
